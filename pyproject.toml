[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosevoice"
dynamic = ["version"]
description = "Support package for the prosevoice narrative-essay skill: layered configuration, guidance resolution and JSON helper commands."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Dixson", email = "dixson3@gmail.com" }]
dependencies = []

[project.urls]
Source = "https://github.com/dixson3/prose-voice"

[project.scripts]
prosevoice = "prosevoice_lib.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[^\\s]+)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["skills/prosevoice/scripts/prosevoice_lib"]

# Resources the runtime reads are shipped under prosevoice_lib/_skill/ so the packaged
# skill_root() never depends on a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/prosevoice/SKILL.md" = "prosevoice_lib/_skill/SKILL.md"
"skills/prosevoice/PROSEVOICE-PROTOCOL.md" = "prosevoice_lib/_skill/PROSEVOICE-PROTOCOL.md"
"skills/prosevoice/agents" = "prosevoice_lib/_skill/agents"
"skills/prosevoice/harper" = "prosevoice_lib/_skill/harper"
"skills/prosevoice/templates" = "prosevoice_lib/_skill/templates"

[tool.hatch.build.targets.sdist]
include = ["skills/prosevoice", "tests", "README.md", "LICENSE", "VERSION", "pyproject.toml"]

[tool.pyright]
# Tests and the launcher import prosevoice_lib from the source skill tree.
extraPaths = ["skills/prosevoice/scripts"]

[tool.uv]
# Tests import the source tree directly; do not install the project into the dev venv.
package = false
