schema_version: 1
id: planning-draft
type: Process
okf_spec: MOMOTRON-PROCESS
version: 1.0.0
kind: planning
title: Planning draft and publish
description: Draft a staged candidate, validated on submit, then publish it through the runner-owned operation.
outputs:
- candidate
nodes:
- id: start
  type: start
- id: draft
  type: task
  title: Draft candidate
  candidate: stage
  executor:
    kind: agent
    role: agents/drafter.md
  rework:
    max_cycles: 2
- id: publish
  type: task
  title: Publish candidate
  executor:
    kind: builtin
    op: publish-candidate
- id: end
  type: end
edges:
- from: start
  to: draft
- from: draft
  to: publish
- from: publish
  to: end
